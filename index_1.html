<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Welpen-App">
<meta name="robots" content="noindex">
<title>Welpen-App · Prototyp</title>
<style>
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --ink:#1E2621; --muted:#5B6660; --line:#E2E5DE; --line2:#EEF0EA;
  --field:#CFD5CC; --accent:#2F6B4F; --accent-ink:#1F4A36; --sage:#5E8B66;
  --warn-bg:#FBEFE8; --warn-ink:#7A3517; --ok-bg:#E3EFE8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.dogbtn{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;min-height:44px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.dogname{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sub{font-size:13px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid #D5DAD1;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
main{flex:1;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
h1{font-size:24px;font-weight:800;margin:4px 2px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card.big{border-radius:18px;padding:18px}
.label{font-size:12px;color:var(--muted);font-weight:600}
.small{font-size:12px;color:var(--muted);line-height:1.5}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chip{font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;display:inline-block}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.cta{background:var(--accent);border:0;border-radius:16px;padding:16px;text-align:left;color:#fff;display:flex;align-items:center;gap:12px;min-height:72px}
.field{height:44px;border-radius:10px;border:1px solid var(--field);padding:0 10px;font-size:16px;background:#fff;width:100%}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.btn{height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--field)}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--field);background:#fff;font-size:22px;font-weight:700;flex:none}
.list > div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.list > div:last-child{border-bottom:0}
.del{background:none;border:0;color:var(--muted);width:36px;height:36px;border-radius:8px;font-size:18px}
.comp{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line2)}
.comp .n{flex:1;font-size:14px;font-weight:600}
.comp .s{font-size:12px;color:var(--muted);width:38px;text-align:right}
.comp .d{font-size:14px;font-weight:800;width:56px;text-align:right}
.comp .w{font-size:13px;color:var(--muted);width:62px;text-align:right}
.bcsrow{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.bcsrow button{height:44px;border-radius:10px;font-weight:800;font-size:15px;padding:0;background:#fff;border:1px solid var(--field)}
.bcsrow button.on{background:var(--accent);color:#fff;border:0}
.seg{display:flex;gap:6px}
.seg button{height:44px;padding:0 12px;border-radius:10px;font-weight:700;font-size:14px;background:#fff;border:1px solid var(--field)}
.seg button.on{background:var(--accent);color:#fff;border:0}
.steps{display:flex;gap:6px}
.steps span{flex:1;text-align:center;padding:8px 4px;border-radius:999px;font-size:12px;font-weight:700;background:var(--line2);color:var(--muted)}
.steps span.on{background:var(--accent);color:#fff}
.doglist button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;min-height:64px;background:#fff;border:1px solid var(--line);width:100%;text-align:left}
.doglist button.on{border:2px solid var(--accent)}
.dash{min-height:48px;border-radius:14px;border:1.5px dashed #AEB6AA;background:transparent;font-weight:700;font-size:14px;width:100%}
.viewfinder{width:100%;aspect-ratio:3/4;max-height:320px;border-radius:12px;background:#2B3530;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.viewfinder img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.viewfinder svg{position:relative}
.vfhint{position:absolute;left:12px;right:12px;bottom:10px;text-align:center;font-size:12px;color:#D9DED6;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.camcta{height:48px;padding:0 22px;border-radius:24px;border:0;background:#fff;color:var(--ink);font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.thumb{width:48px;height:48px;border-radius:10px;background:#E3E8E0;flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 6px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.notice{background:#FFF8E6;border:1px solid #EAD9A8;border-radius:16px;padding:14px;font-size:13px;line-height:1.5}
.warnbox{background:var(--warn-bg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;font-size:11px;font-weight:700;padding:8px 0;min-height:52px;color:var(--muted)}
nav button.on{color:var(--accent)}
.toast{position:absolute;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600}
.overlay{position:absolute;inset:0;background:rgba(20,26,22,.45);display:flex;align-items:flex-end;z-index:10}
.sheet{background:var(--bg);width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.sheet h2{font-size:20px;font-weight:800;margin:0}
.radio{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--field);background:#fff;font-size:15px;font-weight:700;color:var(--ink)}
.radio input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.err{color:#7A3517;font-size:13px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  var STORE = 'welpenapp-proto-v1';
  var DAY = 86400000;

  function isoLocal(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  var TODAY = isoLocal(new Date());

  function exampleDog() {
    return {
      id: 'ex1', example: true, name: 'Beispiel: Leavitt-Hündin', breed: 'Leavitt Bulldog', sex: 'f', birth: '2026-05-13', adult: 27, pct: null,
      weights: [
        { date: '2026-06-13', kg: 2.0 }, { date: '2026-08-14', kg: 7.15 }, { date: '2026-09-07', kg: 10.2 },
        { date: '2026-09-17', kg: 11.0 }, { date: '2026-09-24', kg: 11.6 }, { date: '2026-09-30', kg: 12.0 },
        { date: '2026-10-08', kg: 12.6 }, { date: '2026-10-15', kg: 13.1 }, { date: '2026-10-22', kg: 13.8 }
      ],
      photos: [{ date: '2026-10-22', bcs: 4, img: null }]
    };
  }

  function load() { try { var s = localStorage.getItem(STORE); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) { flash('Speichern im Browser nicht möglich'); } }

  var data = load() || { dogs: [exampleDog()], dogIdx: 0 };
  if (!data.dogs || !data.dogs.length) data = { dogs: [exampleDog()], dogIdx: 0 };
  if (data.dogIdx >= data.dogs.length) data.dogIdx = 0;
  var ui = { tab: 'home', bcsPick: 4, photoDraft: null, toast: '' };
  var toastTimer = null;

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function days(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / DAY); }
  function months(birth, d) { return days(birth, d) / 30.44; }
  function de(n, dig) { return n.toFixed(dig).replace('.', ','); }
  function dm(iso) { var p = iso.split('-'); return p[2] + '.' + p[1] + '.'; }
  function dmy(iso) { var p = iso.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
  function addDays(iso, n) { return new Date(Date.parse(iso) + n * DAY).toISOString().slice(0, 10); }
  function kgText(v) { var r = Math.round(v * 10) / 10; return Math.abs(r - Math.round(r)) < 1e-9 ? String(Math.round(r)) : de(r, 1); }
  function kg2(v) { return de(v, 2).replace(/0$/, ''); }
  function parseNum(s) { return parseFloat(String(s).replace(',', '.')); }

  var BAND = [[0, 0.03, 0.04], [1, 0.09, 0.11], [1.85, 0.15, 0.185], [3, 0.26, 0.30], [4, 0.37, 0.44], [5, 0.48, 0.52], [6, 0.56, 0.63], [8, 0.70, 0.78], [10, 0.81, 0.89], [12, 0.89, 0.93], [18, 0.96, 1.0], [24, 1.0, 1.04]];
  function band(m) {
    if (m <= 0) return [BAND[0][1], BAND[0][2]];
    for (var i = 1; i < BAND.length; i++) {
      if (m <= BAND[i][0]) { var a = BAND[i - 1], b = BAND[i], t = (m - a[0]) / (b[0] - a[0]); return [a[1] + t * (b[1] - a[1]), a[2] + t * (b[2] - a[2])]; }
    }
    return [1.0, 1.04];
  }
  function defaultPct(m) { if (m < 4) return 6; if (m < 6) return 5; if (m < 9) return 4; if (m < 12) return 3; return 2.5; }
  function pctRange(m) { if (m < 4) return 'unter 4 Monate'; if (m < 6) return '4–6 Monate'; if (m < 9) return '6–9 Monate'; if (m < 12) return '9–12 Monate'; return 'erwachsen'; }
  function bcsLabel(b) { if (b <= 3) return 'zu dünn'; if (b === 4) return 'schlank'; if (b === 5) return 'ideal'; if (b <= 7) return 'leicht übergewichtig'; return 'übergewichtig'; }
  function ageParts(birth, d) { var b = new Date(birth), t = new Date(d); var m = (t.getUTCFullYear() - b.getUTCFullYear()) * 12 + (t.getUTCMonth() - b.getUTCMonth()); if (t.getUTCDate() < b.getUTCDate()) m--; m = Math.max(0, m); return { y: Math.floor(m / 12), m: m % 12 }; }
  function ageText(birth, d) { var n = days(birth, d); if (n < 0) return 'noch nicht geboren'; if (n < 365) return Math.floor(n / 7) + ' Wochen'; var p = ageParts(birth, d); var s = p.y + (p.y === 1 ? ' Jahr' : ' Jahre'); if (p.m > 0) s += ' ' + p.m + (p.m === 1 ? ' Monat' : ' Monate'); return s; }
  function ageShort(birth, d) { var n = days(birth, d); if (n < 365) return Math.max(0, Math.floor(n / 7)) + ' Wo.'; var p = ageParts(birth, d); return p.y + ' J. ' + p.m + ' Mon.'; }
  function phase(m, adult) {
    var adultAt = adult >= 25 ? 24 : (adult >= 10 ? 18 : 12);
    if (m < 12) return { key: 'puppy', idx: 0, label: 'Welpe', info: 'Wöchentlich wiegen, Wachstumskorridor aktiv. Der BARF-Anteil sinkt mit dem Alter.' };
    if (m < adultAt) return { key: 'junior', idx: 1, label: 'Junghund', info: 'Alle 2 Wochen wiegen. Größere Rassen legen bis ca. ' + adultAt + ' Monate noch zu und füllen aus.' };
    return { key: 'adult', idx: 2, label: 'Erwachsen', info: 'Monatlich wiegen und Gewicht halten. BARF mit ca. 2–3 % vom Körpergewicht.' };
  }
  function weighDays(k) { return k === 'puppy' ? 7 : (k === 'junior' ? 14 : 30); }
  function weighLabel(k) { return k === 'puppy' ? 'Wöchentlich' : (k === 'junior' ? 'Alle 2 Wochen' : 'Monatlich'); }
  function sexText(s) { return s === 'f' ? 'Hündin' : 'Rüde'; }
  function initial(n) { n = String(n || '?').replace(/^Beispiel:\s*/, ''); return n.charAt(0).toUpperCase() || '?'; }

  function dog() { return data.dogs[data.dogIdx]; }
  function sortedWeights(d) { return d.weights.slice().sort(function (a, b) { return Date.parse(a.date) - Date.parse(b.date); }); }

  // ---------- computations ----------
  function compute(d) {
    var ws = sortedWeights(d), has = ws.length > 0, last = has ? ws[ws.length - 1] : null;
    var ageM = months(d.birth, TODAY), ph = phase(ageM, d.adult), adultMode = ph.key === 'adult';
    var gpd = null, gainWindow = 'noch zu wenige Einträge';
    if (ws.length > 1) {
      var prev = null;
      for (var i = ws.length - 2; i >= 0; i--) { if (days(ws[i].date, last.date) >= 6) { prev = ws[i]; break; } }
      if (!prev) prev = ws[ws.length - 2];
      var dd = Math.max(1, days(prev.date, last.date));
      gpd = (last.kg - prev.kg) * 1000 / dd;
      gainWindow = 'seit ' + dm(prev.date) + ' (' + dd + ' Tage)';
    }
    var status = 'Noch keine Daten', sBg = '#EEF0EA', sFg = '#1E2621';
    function ok(t) { status = t; sBg = '#E3EFE8'; sFg = '#1F4A36'; }
    function bad(t) { status = t; sBg = '#FBEFE8'; sFg = '#7A3517'; }
    if (has && adultMode) {
      if (last.kg < d.adult * 0.95) bad('Unter dem Zielbereich'); else if (last.kg > d.adult * 1.05) bad('Über dem Zielbereich'); else ok('Im Zielbereich');
    } else if (has) {
      var bb = band(months(d.birth, last.date)), lo = bb[0] * d.adult, hi = bb[1] * d.adult;
      if (last.kg < lo * 0.95) bad('Unter dem Korridor');
      else if (last.kg < lo + (hi - lo) * 0.33) ok('Im Korridor · unterer Rand');
      else if (last.kg <= hi * 1.05) ok('Im Korridor');
      else bad('Über dem Korridor');
    }
    var b1 = band(ageM - 0.5), b2 = band(ageM + 0.5);
    var targetNum = ((b2[0] + b2[1]) / 2 - (b1[0] + b1[1]) / 2) * d.adult * 1000 / 30.44;
    var pct = d.pct != null ? d.pct : defaultPct(ageM);
    var total = has ? last.kg * pct * 10 : 0;
    var photos = d.photos.slice().sort(function (a, b) { return Date.parse(b.date) - Date.parse(a.date); });
    return {
      ws: ws, has: has, last: last, ageM: ageM, ph: ph, adultMode: adultMode, gpd: gpd, gainWindow: gainWindow,
      status: status, sBg: sBg, sFg: sFg,
      target: adultMode ? de(d.adult * 0.95, 1) + '–' + de(d.adult * 1.05, 1) + ' kg' : '≈ ' + Math.max(0, Math.round(targetNum / 5) * 5) + ' g/Tag',
      targetTitle: adultMode ? 'Zielbereich' : 'Richtwert', targetSub: adultMode ? 'Zielgewicht ±5 %' : 'laut Korridor',
      pct: pct, total: total, photos: photos,
      nextDate: has ? dm(addDays(last.date, weighDays(ph.key))) : 'heute'
    };
  }
  function gText(g) { return g == null ? '–' : (g >= 0 ? '+' : '−') + Math.round(Math.abs(g)) + ' g/Tag'; }

  function niceStep(range) { var raw = Math.max(range, 0.4) / 4; var p = Math.pow(10, Math.floor(Math.log10(raw))); var n = raw / p; return (n <= 1 ? 1 : (n <= 2 ? 2 : (n <= 5 ? 5 : 10))) * p; }

  function chart(d, c) {
    var X0 = 34, X1 = 332, Y0 = 10, Y1 = 186;
    var pts = [], up = [], dn = [], xl = [], xTitle, bandLabel, yMin = 0, yMax = 10, step = 5;
    if (c.adultMode) {
      // window starts at the first entry (max. 12 months back) and runs at least 6 months forward
      var now = Date.parse(TODAY), cut = now - 365 * DAY;
      var win = c.ws.filter(function (e) { return Date.parse(e.date) >= cut; });
      var older = win.length < c.ws.length;
      var tStart = win.length ? Date.parse(win[0].date) : now;
      var tEnd = Math.max(now, win.length ? Date.parse(win[win.length - 1].date) : now, tStart + 182 * DAY);
      var span = tEnd - tStart; tStart -= span * 0.03; tEnd += span * 0.03;
      var sxT = function (t) { return X0 + (t - tStart) / (tEnd - tStart) * (X1 - X0); };
      var lo = d.adult * 0.95, hi = d.adult * 1.05;
      pts = win.map(function (e) { return { x: sxT(Date.parse(e.date)), kg: e.kg, lo: lo, hi: hi }; });
      var vals = win.map(function (e) { return e.kg; }).concat([lo, hi]);
      var vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
      step = niceStep(Math.max(vmax - vmin, d.adult * 0.2));
      yMin = Math.max(0, Math.floor((vmin - step * 0.5) / step) * step);
      yMax = Math.ceil((vmax + step * 0.5) / step) * step;
      up = [{ x: X0, kg: hi }, { x: X1, kg: hi }]; dn = [{ x: X1, kg: lo }, { x: X0, kg: lo }];
      var MN = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
      var d0 = new Date(tStart), cur = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1);
      var every = (tEnd - tStart) / (30.44 * DAY) > 7 ? 2 : 1, n = 0;
      while (cur <= tEnd) { var dt = new Date(cur); if (n % every === 0) xl.push({ x: sxT(cur), t: MN[dt.getUTCMonth()] }); n++; cur = Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 1); }
      xTitle = older ? 'Letzte 12 Monate' : 'Seit dem ersten Eintrag'; bandLabel = 'Zielbereich (' + kgText(d.adult) + ' kg ±5 %)';
    } else {
      var mMax = Math.max(8, Math.ceil(c.ageM + 1));
      var sxM = function (m) { return X0 + (m / mMax) * (X1 - X0); };
      pts = c.ws.map(function (e) { var m = months(d.birth, e.date), bm = band(m); return { x: sxM(m), kg: e.kg, lo: bm[0] * d.adult, hi: bm[1] * d.adult }; });
      var dmax = c.ws.reduce(function (a, e) { return Math.max(a, e.kg); }, 0);
      var topV = Math.max(band(mMax)[1] * d.adult, dmax);
      step = niceStep(topV); yMin = 0; yMax = Math.ceil(topV * 1.05 / step) * step;
      for (var m = 1; m <= mMax + 0.001; m += 0.25) { var bd = band(m); up.push({ x: sxM(m), kg: bd[1] * d.adult }); dn.unshift({ x: sxM(m), kg: bd[0] * d.adult }); }
      var tick = mMax <= 12 ? 1 : (mMax <= 24 ? 3 : 6);
      for (var x = 0; x <= mMax; x += tick) xl.push({ x: sxM(x), t: String(x) });
      xTitle = 'Alter in Monaten'; bandLabel = 'Korridor (≈ ' + kgText(d.adult) + ' kg)';
    }
    var sy = function (kg) { return Y1 - (kg - yMin) / (yMax - yMin) * (Y1 - Y0); };
    var wBelow = c.adultMode ? 1 : 0.6;
    function col(p) {
      var s = 0;
      if (p.kg < p.lo) s = (p.lo - p.kg) / p.lo * wBelow; else if (p.kg > p.hi) s = (p.kg - p.hi) / p.hi;
      if (s <= 0) return '#5E8B66'; if (s < 0.05) return '#C08A1E'; if (s < 0.10) return '#D46A1F'; if (s < 0.15) return '#CC4A26'; return '#B3261E';
    }
    var g = '';
    for (var k = yMin; k <= yMax + 1e-9; k += step) {
      var yy = sy(k).toFixed(1);
      g += '<path d="M' + X0 + ' ' + yy + ' H' + X1 + '" stroke="#E7EAE3" stroke-width="1"/>';
      g += '<text x="' + (X0 - 6) + '" y="' + (sy(k) + 3.5).toFixed(1) + '" text-anchor="end" font-size="10" fill="#5B6660">' + (Math.abs(k - Math.round(k)) < 1e-9 ? Math.round(k) : de(k, 1)) + '</text>';
    }

      '<label class="lbl">Geburtsdatum<input id="ndBirth" class="field" type="date" max="' + TODAY + '"></label>' +
      '<div class="lbl">Geschlecht<div class="seg"><label class="radio"><input type="radio" name="ndSex" id="ndSexF" value="f" checked>Hündin</label><label class="radio"><input type="radio" name="ndSex" id="ndSexM" value="m">Rüde</label></div></div>' +
      '<label class="lbl">Erwartetes Endgewicht bzw. Zielgewicht (kg)<input id="ndAdult" class="field" type="text" inputmode="decimal" autocomplete="off" placeholder="z. B. 27 oder 3,5"></label>' +
      '<span class="small">Tipp: Bei Welpen das Gewicht der Elterntiere als Anhaltspunkt nehmen.</span>' +
      '<div class="card" style="display:flex;flex-direction:column;gap:8px"><span style="font-size:14px;font-weight:700">Erstes Gewicht (optional)</span>' +
      '<div class="row" style="gap:8px"><label class="lbl" style="flex:1;min-width:0">Datum<input id="ndWDate" class="field" type="date" value="' + TODAY + '" max="' + TODAY + '"></label>' +
      '<label class="lbl" style="flex:0 0 90px">kg<input id="ndWKg" class="field" type="text" inputmode="decimal" autocomplete="off" placeholder="14,2"></label></div></div>' +
      (ui.modalErr ? '<span class="err" role="alert">' + esc(ui.modalErr) + '</span>' : '') +
      '<div class="row" style="gap:10px"><button class="btn ghost" style="flex:1" data-act="closeModal">Abbrechen</button><button class="btn" style="flex:1.4" data-act="createDog">Hund anlegen</button></div>' +
      '</div></div>';
  }

  // ---------- render ----------
  var app = document.getElementById('app');
  function render() {
    var main = app.querySelector('main');
    var keep = main && main.dataset.tab === ui.tab ? main.scrollTop : 0;
    // keep typed values of id'd inputs across re-renders
    var vals = {}, focusId = document.activeElement && document.activeElement.id;
    Array.prototype.forEach.call(app.querySelectorAll('input[id]'), function (el) { if (el.type !== 'file') vals[el.id] = el.type === 'radio' ? el.checked : el.value; });
    var d = dog(), c = compute(d);
    var view = ui.tab === 'weight' ? viewWeight(d, c) : ui.tab === 'barf' ? viewBarf(d, c) : ui.tab === 'photo' ? viewPhoto(d, c) : ui.tab === 'profile' ? viewProfile(d, c) : viewHome(d, c);
    var tab = function (k, label, icon) { return '<button class="' + (ui.tab === k ? 'on' : '') + '" data-act="tab:' + k + '"' + (ui.tab === k ? ' aria-current="page"' : '') + '>' + icon + label + '</button>'; };
    app.innerHTML =
      '<header><button class="dogbtn" data-act="tab:profile" aria-label="Hund wechseln oder bearbeiten"><span class="avatar">' + esc(initial(d.name)) + '</span><span style="min-width:0"><span class="dogname">' + esc(d.name) + '</span><span class="sub">' + esc(d.breed || 'Rasse?') + ' · ' + sexText(d.sex) + ' · ' + ageText(d.birth, TODAY) + '</span></span></button>' +
      '<button class="iconbtn" data-act="tab:profile" aria-label="Hunde verwalten">' + IC.user + '</button></header>' +
      '<main data-tab="' + ui.tab + '">' + view + '</main>' +
      (ui.toast ? '<div class="toast" role="status">' + esc(ui.toast) + '</div>' : '') +
      '<nav aria-label="Hauptnavigation">' + tab('home', 'Übersicht', IC.home) + tab('weight', 'Gewicht', IC.weight) + tab('barf', 'BARF', IC.barf) + tab('photo', 'Statur', IC.cam) + '</nav>' +
      (ui.modal === 'addDog' ? viewAddDog() : '');
    var m2 = app.querySelector('main'); if (m2) m2.scrollTop = keep;
    Object.keys(vals).forEach(function (id) { var el = document.getElementById(id); if (!el) return; if (el.type === 'radio') el.checked = vals[id]; else el.value = vals[id]; });
    if (focusId) { var f = document.getElementById(focusId); if (f && f.focus) f.focus(); }
  }
  function flash(msg) { ui.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(function () { ui.toast = ''; render(); }, 2200); }
  function upd(fn) { fn(dog()); save(); render(); }

  // ---------- actions ----------
  function act(name, arg) {
    var d = dog(), c;
    switch (name) {
      case 'tab': ui.tab = arg; if (arg !== 'photo') ui.photoDraft = null; render(); app.querySelector('main').scrollTop = 0; break;
      case 'addWeight': {
        var dt = document.getElementById('nwDate').value, kg = parseNum(document.getElementById('nwKg').value);
        if (!dt || !(kg > 0 && kg < 150)) { flash('Bitte Datum und Gewicht eingeben'); return; }
        if (d.example) { flash('Beispielhund: bitte eigenen Hund anlegen'); return; }
        d.weights = d.weights.filter(function (e) { return e.date !== dt; }).concat([{ date: dt, kg: kg }]);
        document.getElementById('nwKg').value = '';
        save(); flash('Gewicht gespeichert'); break;
      }
      case 'delWeight': if (d.example) { flash('Beispielhund kann nicht bearbeitet werden'); return; } upd(function (x) { x.weights = x.weights.filter(function (e) { return e.date !== arg; }); }); break;
      case 'pctMinus': c = compute(d); upd(function (x) { x.pct = Math.max(1, Math.round((c.pct - 0.5) * 10) / 10); }); break;
      case 'pctPlus': c = compute(d); upd(function (x) { x.pct = Math.min(10, Math.round((c.pct + 0.5) * 10) / 10); }); break;
      case 'pctReset': upd(function (x) { x.pct = null; }); break;
      case 'bcs': ui.bcsPick = parseInt(arg, 10); render(); break;
      case 'savePhoto':
        if (d.example) { flash('Beispielhund: bitte eigenen Hund anlegen'); return; }
        d.photos = d.photos.filter(function (e) { return e.date !== TODAY; }).concat([{ date: TODAY, bcs: ui.bcsPick, img: ui.photoDraft }]);
        ui.photoDraft = null; save(); flash('Eintrag mit BCS ' + ui.bcsPick + ' gespeichert'); break;
      case 'delPhoto': if (d.example) { flash('Beispielhund kann nicht bearbeitet werden'); return; } upd(function (x) { x.photos = x.photos.filter(function (e) { return e.date !== arg; }); }); break;
      case 'pickDog': data.dogIdx = parseInt(arg, 10); save(); ui.tab = 'home'; render(); break;
      case 'addDog':
        ui.modal = 'addDog'; ui.modalErr = ''; render();
        setTimeout(function () { var n = document.getElementById('ndName'); if (n) n.focus(); }, 30);
        break;
      case 'closeModal': ui.modal = null; ui.modalErr = ''; render(); break;
      case 'createDog': {
        var v = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
        var nm = v('ndName'), br = v('ndBreed'), bd = v('ndBirth'), ad = parseNum(v('ndAdult'));
        var sx = document.getElementById('ndSexM').checked ? 'm' : 'f';
        var wd = v('ndWDate'), wkRaw = v('ndWKg'), wk = parseNum(wkRaw);
        var err = !nm ? 'Bitte einen Namen eingeben.' : !bd ? 'Bitte das Geburtsdatum eingeben.' : bd > TODAY ? 'Das Geburtsdatum liegt in der Zukunft.' :
          !(ad >= 0.5 && ad <= 100) ? 'Bitte ein End- bzw. Zielgewicht zwischen 0,5 und 100 kg eingeben.' :
          (wkRaw && !(wk > 0 && wk < 150)) ? 'Das erste Gewicht ist ungültig.' : (wkRaw && !wd) ? 'Bitte ein Datum zum ersten Gewicht eingeben.' :
          (wkRaw && wd < bd) ? 'Das erste Gewicht liegt vor dem Geburtsdatum.' : '';
        if (err) { ui.modalErr = err; render(); return; }
        var nd = { id: 'd' + Date.now(), name: nm, breed: br, sex: sx, birth: bd, adult: Math.round(ad * 10) / 10, pct: null,
          weights: wkRaw ? [{ date: wd, kg: wk }] : [], photos: [] };
        data.dogs.push(nd); data.dogIdx = data.dogs.length - 1; save();
        ui.modal = null; ui.modalErr = ''; ui.tab = 'home';
        flash('„' + nm + '“ angelegt'); break;
      }
      case 'delDog':
        if (!confirm('„' + d.name + '“ mit allen Einträgen löschen?')) return;
        data.dogs.splice(data.dogIdx, 1); if (!data.dogs.length) data.dogs = [exampleDog()]; data.dogIdx = 0; save(); ui.tab = 'home'; render(); break;
      case 'sex': if (d.example) { flash('Beispielhund kann nicht bearbeitet werden'); return; } upd(function (x) { x.sex = arg; }); break;
      case 'adultMinus': if (d.example) { flash('Beispielhund kann nicht bearbeitet werden'); return; } upd(function (x) { x.adult = Math.max(0.5, Math.round((x.adult - (x.adult <= 10 ? 0.1 : 0.5)) * 10) / 10); }); break;
      case 'adultPlus': if (d.example) { flash('Beispielhund kann nicht bearbeitet werden'); return; } upd(function (x) { x.adult = Math.min(100, Math.round((x.adult + (x.adult < 10 ? 0.1 : 0.5)) * 10) / 10); }); break;
      case 'resetAll':
        if (!confirm('Wirklich alle Hunde und Einträge auf diesem Gerät löschen?')) return;
        data = { dogs: [exampleDog()], dogIdx: 0 }; save(); ui.tab = 'home'; render(); break;
    }
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    // clicks inside the sheet must not close it via the backdrop
    if (el.classList.contains('overlay') && e.target.closest('[data-stop]')) return;
    var a = el.getAttribute('data-act'), i = a.indexOf(':');
    act(i < 0 ? a : a.slice(0, i), i < 0 ? null : a.slice(i + 1));
  });

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'photoInput' && t.files && t.files[0]) { readPhoto(t.files[0]); return; }
    var f = t.getAttribute('data-field'); if (!f) return;
    var d = dog();
    if (d.example) { flash('Beispielhund kann nicht bearbeitet werden'); return; }
    if (f === 'name') d.name = t.value.trim() || 'Mein Hund';
    else if (f === 'breed') d.breed = t.value.trim();
    else if (f === 'birth') { if (!t.value) return; d.birth = t.value; }
    else if (f === 'adult') { var n = parseNum(t.value); if (!(n >= 0.5 && n <= 100)) { flash('Bitte ein Gewicht zwischen 0,5 und 100 kg'); render(); return; } d.adult = Math.round(n * 10) / 10; }
    save(); render();
  });

  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'nwKg') { e.preventDefault(); act('addWeight'); }
    if (ui.modal && e.key === 'Escape') { act('closeModal'); }
    if (ui.modal && e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); act('createDog'); }
  });

  function readPhoto(file) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var max = 360, s = Math.min(1, max / Math.max(img.width, img.height));
      var cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      try { ui.photoDraft = cv.toDataURL('image/jpeg', 0.72); } catch (e) { ui.photoDraft = null; }
      render();
    };
    img.onerror = function () { URL.revokeObjectURL(url); flash('Foto konnte nicht gelesen werden'); };
    img.src = url;
  }

  render();
})();
</script>
</body>
</html>
